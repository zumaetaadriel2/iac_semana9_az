name: saludo

on:
  push:
    branches:
      - main
      - develop

env:
  nombre: "Adriel Zumaeta"

jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: saludo desde main
        if: github.ref == 'refs/heads/main'
        run: echo "Hola desde main, soy $nombre"
        
      - name: saludo desde develop
        if: github.ref == 'refs/heads/develop'
        run: echo "Hola desde develop, soy $nombre"
